<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pixel Platformer</title>
  <style>
    :root{font-family:monospace;color:#172554;background:#87ceeb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#87ceeb}main{width:min(960px,100%);padding:20px;text-align:center}h1{font-size:clamp(24px,5vw,48px);margin:0 0 8px;color:#1e3a8a}p{margin:8px 0 16px;font-size:14px}canvas{width:100%;max-width:900px;image-rendering:pixelated;background:#87ceeb;border:6px solid #172554;box-shadow:8px 8px 0 #1e3a8a}button{font:inherit;font-weight:bold;border:3px solid #172554;background:#facc15;padding:10px 16px;cursor:pointer;margin-top:14px}button:hover{background:#fde047}.hint{color:#334155}
  </style>
</head>
<body>
<main><h1>Pixel Platformer</h1><p>Um mini jogo de plataforma inspirado nos clássicos.</p><canvas id="game" width="900" height="420"></canvas><div class="hint">Use ← → ou A/D para andar · Espaço/W/↑ para pular · pegue as moedas</div><button id="restart">Recomeçar</button></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height;let keys={},hero,coins,blocks,score,won;
const level=()=>{hero={x:54,y:300,w:24,h:30,vx:0,vy:0,on:false};score=0;won=false;coins=[{x:240,y:310},{x:390,y:230},{x:570,y:310},{x:755,y:190}];blocks=[{x:0,y:360,w:900,h:60},{x:180,y:300,w:110,h:18},{x:350,y:260,w:110,h:18},{x:520,y:300,w:110,h:18},{x:690,y:220,w:140,h:18}];};level();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#restart').onclick=level;
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function update(){let left=keys.arrowleft||keys.a,right=keys.arrowright||keys.d,jump=keys[' ']||keys.arrowup||keys.w;hero.vx=(right?3:0)-(left?3:0);if(jump&&hero.on){hero.vy=-10;hero.on=false}hero.vy+=.45;hero.x+=hero.vx;hero.x=Math.max(0,Math.min(W-hero.w,hero.x));let oldY=hero.y;hero.y+=hero.vy;hero.on=false;for(const b of blocks)if(hit(hero,b)&&oldY+hero.h<=b.y+6&&hero.vy>=0){hero.y=b.y-hero.h;hero.vy=0;hero.on=true}for(let i=coins.length-1;i>=0;i--)if(hit(hero,{x:coins[i].x-8,y:coins[i].y-8,w:16,h:16})){coins.splice(i,1);score++}if(hero.y>H)level();if(score===4)won=true}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#87ceeb';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(80,65,95,20);x.fillRect(55,85,145,20);x.fillRect(680,55,100,20);x.fillRect(650,75,160,20);x.fillStyle='#65a30d';x.fillRect(0,340,W,20);for(const b of blocks){x.fillStyle=b.y>340?'#a16207':'#b45309';x.fillRect(b.x,b.y,b.w,b.h);if(b.y<340){x.fillStyle='#f59e0b';for(let i=b.x;i<b.x+b.w;i+=28)x.fillRect(i,b.y+2,24,4)}}for(const m of coins){x.fillStyle='#facc15';x.fillRect(m.x-7,m.y-9,14,18);x.fillStyle='#92400e';x.fillRect(m.x-2,m.y-5,4,10)}x.fillStyle='#dc2626';x.fillRect(hero.x+2,hero.y,20,8);x.fillRect(hero.x+6,hero.y-6,14,7);x.fillStyle='#f5cfa0';x.fillRect(hero.x+5,hero.y+8,17,11);x.fillStyle='#1d4ed8';x.fillRect(hero.x+2,hero.y+19,20,11);x.fillStyle='#172554';x.fillRect(hero.x+9,hero.y+11,3,3);x.fillRect(hero.x+19,hero.y+11,3,3);x.fillStyle='#172554';x.font='bold 18px monospace';x.fillText('MOEDAS: '+score+'/4',20,30);if(won){x.fillStyle='#172554';x.fillRect(270,130,360,90);x.fillStyle='#facc15';x.font='bold 28px monospace';x.fillText('VOCÊ VENCEU!',335,170);x.font='16px monospace';x.fillText('Clique em Recomeçar',332,198)}}function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
