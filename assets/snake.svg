<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="Cobrinha verde animada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop stop-color="#22c55e"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".28"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="20" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="172" rx="12" fill="url(#grid)" stroke="#334155"/>

  <g fill="none" stroke="url(#green)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 140H310V80H470V140H630V80H790V140H950V80H1050">
      <animate attributeName="stroke-dasharray" values="0 1400;1400 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle r="11" fill="#ecfccb" stroke="#22c55e" stroke-width="4">
      <animateMotion dur="5s" repeatCount="indefinite" path="M150 140H310V80H470V140H630V80H790V140H950V80H1050"/>
    </circle>
    <circle cx="1050" cy="80" r="3" fill="#0f172a">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="52" y="62" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="2">SNAKE.EXE</text>
  <text x="52" y="178" fill="#86efac" font-family="monospace" font-size="14">MOVING • SCORE: ∞</text>
</svg>
